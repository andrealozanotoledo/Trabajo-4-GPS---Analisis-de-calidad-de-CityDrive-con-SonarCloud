
name: SonarCloud

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  sonarcloud:
    name: Analisis SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analizar codigo con SonarCloud
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=andrealozanotoledo
            -Dsonar.projectKey=andrealozanotoledo_Trabajo-4-GPS---Analisis-de-calidad-de-CityDrive-con-SonarCloud
            -Dsonar.tests=tests,test_cancelacion.py
            -Dsonar.python.version=3.14
            -Dsonar.sourceEncoding=UTF-8
